services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: warewolf
      POSTGRES_PASSWORD: warewolf
      POSTGRES_DB: warewolf
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warewolf -d warewolf"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
