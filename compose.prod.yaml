# Production-shaped stack (WW-1501, WW-1502). The API applies pending
# migrations before it listens. The web container serves the built client
# and proxies /api and Socket.IO to the API.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: warewolf
      POSTGRES_PASSWORD: warewolf
      POSTGRES_DB: warewolf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warewolf -d warewolf"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://warewolf:warewolf@postgres:5432/warewolf
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
