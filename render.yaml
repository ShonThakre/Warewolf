# Render Blueprint (HOST-01). One Docker web service and one PostgreSQL.
# Apply it in the Render dashboard: New > Blueprint > this repository.
#
# Keep exactly one instance. Phase deadlines are in-process timers and
# Socket.IO rooms live in memory, so a second instance would split games.
services:
  - type: web
    name: warewolf
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free: sleeps after 15 idle minutes and wakes on the next visit in about
    # a minute. Phase timers recover on boot. "starter" ($7/mo) stays on.
    plan: free
    region: singapore
    numInstances: 1
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health/ready
    envVars:
      # WebView origin of APKs built before APK-01, which bundled the client
      # and served it from https://localhost. Current APKs load this site
      # itself (same origin) and need no entry. Remove once old APKs are gone.
      - key: CORS_ORIGINS
        value: https://localhost
      - key: DATABASE_URL
        fromDatabase:
          name: warewolf-db
          property: connectionString

databases:
  - name: warewolf-db
    # Free: expires 30 days after creation, then its data is deleted. Recreate
    # it, or move to "basic-256mb" ($6/mo) to keep it.
    plan: free
    region: singapore
    databaseName: warewolf
    user: warewolf
    postgresMajorVersion: "17"
